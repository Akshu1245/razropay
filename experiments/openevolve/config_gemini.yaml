max_iterations: 10
checkpoint_interval: 5
random_seed: 42
diff_based_evolution: true
max_code_length: 5000

llm:
  models:
    - name: "gemini-2.5-flash-lite"
      weight: 1.0
  evaluator_models:
    - name: "gemini-2.5-flash-lite"
      weight: 1.0
  api_base: "https://generativelanguage.googleapis.com/v1beta/openai/"
  api_key: ${GEMINI_API_KEY}
  temperature: 0.6
  top_p: 0.9
  max_tokens: 4096
  timeout: 120
  retries: 2

prompt:
  system_message: |
    Improve only the function inside EVOLVE-BLOCK-START / EVOLVE-BLOCK-END.
    It proposes an action; it never authorizes or executes a payment.
    Do not import or reference guardrails, webhook verification, RecoveryTruth,
    Razorpay adapters, networking, subprocesses, files outside this candidate,
    or provider APIs. Safety gates are immutable. Optimize recovery only when
    the evaluator still reports safety_pass=1 and zero_violations=1.
  include_artifacts: true
  num_top_programs: 2
  num_diverse_programs: 1

database:
  population_size: 20
  archive_size: 10
  num_islands: 2
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7

evaluator:
  timeout: 600
  max_retries: 1
  cascade_evaluation: false
  parallel_evaluations: 1
  use_llm_feedback: false
