name: mandateguard-ci

on:
  push:
  pull_request:

jobs:
  clean-checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Checksum manifest candidate
        run: |
          echo '--- SHA256SUMS CANDIDATE BEGIN ---'
          python3 scripts/make_checksum_manifest.py
          echo '--- SHA256SUMS CANDIDATE END ---'
      - name: Test
        run: ./scripts/test.sh
      - name: RecoveryTruth acceptance
        run: python3 scripts/recoverytruth_check.py
      - name: Offline demo
        run: ./scripts/demo.sh
        env:
          MANDATEGUARD_OFFLINE: "1"
      - name: Final benchmark
        run: ./scripts/evaluate.sh
        env:
          MANDATEGUARD_OFFLINE: "1"
      - name: Release gate
        run: ./scripts/release_check.sh
        env:
          MANDATEGUARD_OFFLINE: "1"
      - name: README and report integrity
        run: |
          ! grep -nE '\{\{|\}\}' README.md outputs/report.md
          test -f RECOVERYTRUTH.md
          test -f SUBMISSION_READINESS.md
          test -f outputs/manifest.json
          grep -q '"final": true' outputs/manifest.json
          grep -q '"B1.5"' outputs/manifest.json
          test -f outputs/sensitivity.json
          test -f outputs/sensitivity.png
          grep -q 'harm priced' outputs/report.md
      - name: Upload generated evidence
        uses: actions/upload-artifact@v4
        with:
          name: mandateguard-outputs
          path: |
            outputs/
            FINDINGS.md
