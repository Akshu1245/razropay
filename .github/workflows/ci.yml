name: mandateguard-ci

on:
  push:
  pull_request:

jobs:
  clean-checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Checksum manifest candidate
        run: |
          python3 scripts/make_checksum_manifest.py > /tmp/SHA256SUMS.candidate
          cmp SHA256SUMS.txt /tmp/SHA256SUMS.candidate
          sha256sum -c SHA256SUMS.txt >/dev/null
      - name: Test
        run: ./scripts/test.sh
      - name: RecoveryTruth acceptance
        run: python3 scripts/recoverytruth_check.py
      - name: Security regression acceptance
        run: python3 scripts/security_regression_check.py
      - name: Offline demo
        run: ./scripts/demo.sh
        env:
          MANDATEGUARD_OFFLINE: "1"
      - name: Docker judge-app smoke test
        run: |
          docker build -t mandateguard-submission .
          cid="$(docker run -d -p 8766:8765 mandateguard-submission)"
          cleanup() { docker rm -f "$cid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8766/api/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done
          grep -q '"mode":"local_simulator"' /tmp/health.json
          curl -fsS http://127.0.0.1:8766/ | grep -q 'MandateGuard'
          cleanup
          trap - EXIT
      - name: Deep non-mutating verification
        run: ./scripts/verify_all.sh
        env:
          MANDATEGUARD_OFFLINE: "1"
      - name: Submission integrity
        run: |
          if grep -nE '\{\{|\}\}' README.md SUBMISSION_READINESS.md outputs/report.md; then
            echo "unresolved template tokens found" >&2
            exit 1
          fi
          test -f RECOVERYTRUTH.md
          test -f SUBMISSION_READINESS.md
          test -f ARCHITECTURE.md
          test -f VIDEO_SCRIPT.md
          test -f outputs/manifest.json
          grep -q '"final": true' outputs/manifest.json
          grep -q '"B1.5"' outputs/manifest.json
          test -f outputs/sensitivity.json
          test -f outputs/sensitivity.png
          grep -q 'harm priced' outputs/report.md
          grep -q 'Final Submission Report' SUBMISSION_READINESS.md
      - name: Upload verified evidence
        uses: actions/upload-artifact@v4
        with:
          name: mandateguard-outputs
          path: |
            outputs/
            FINDINGS.md
            RECOVERYTRUTH.md
            ROBUSTNESS.md
            SUBMISSION_READINESS.md
            ARCHITECTURE.md
