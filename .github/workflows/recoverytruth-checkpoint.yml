name: recoverytruth-checkpoint

on:
  push:
    branches: [recoverytruth-v2]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  vertical-slice:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: RecoveryTruth tests
        run: python -m pytest -q tests/test_recoverytruth*.py
      - name: Hero demo
        run: python scripts/demo_recoverytruth.py
      - name: Frozen baseline benchmark
        run: python scripts/eval_recoverytruth_state.py
      - name: Upload checkpoint evidence
        uses: actions/upload-artifact@v4
        with:
          name: recoverytruth-checkpoint
          path: outputs/generated/recoverytruth_state_eval.json
          if-no-files-found: error
