name: manifest-fix-once

on:
  push:
    branches: ["judge-experience-polish"]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: judge-experience-polish

      - name: Regenerate manifest and remove this one-time workflow
        run: |
          rm .github/workflows/manifest-fix-once.yml
          python3 scripts/make_checksum_manifest.py > SHA256SUMS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SHA256SUMS.txt
          git add -u .github/workflows/manifest-fix-once.yml
          git commit -m "Regenerate checksum after isolation fix"
          git push origin HEAD:judge-experience-polish
