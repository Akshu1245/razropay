name: finalize-mandateguard-release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply final hardened source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .mandateguard_patch_chunk_* | base64 -d > /tmp/mandateguard_finalize_patch.tar.gz
          tar -xzf /tmp/mandateguard_finalize_patch.tar.gz -C .
          rm -f docs/repository_provenance.md
          rm -rf release
          chmod +x scripts/demo.sh scripts/evaluate.sh scripts/fixture_sensitivity.py \
            scripts/make_findings.py scripts/make_frontier.py scripts/make_sensitivity_chart.py \
            scripts/mutation_check.py scripts/release_check.sh scripts/test.sh scripts/verify_all.sh

      - name: Install judge dependencies
        run: python -m pip install -r requirements.txt

      - name: Regenerate evidence from the hardened source
        env:
          MANDATEGUARD_OFFLINE: '1'
        run: ./scripts/evaluate.sh

      - name: Verify release behavior
        env:
          MANDATEGUARD_OFFLINE: '1'
        run: ./scripts/release_check.sh

      - name: Remove one-shot bootstrap files and rebuild checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -f .mandateguard_patch_chunk_*
          rm -f .github/workflows/finalize-mandateguard-release.yml
          rm -rf outputs/generated outputs/demo .pytest_cache .hypothesis
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -maxdepth 1 -type d -name '*.egg-info' -prune -exec rm -rf {} +
          rm -f SHA256SUMS.txt
          find . -type f \
            ! -path './.git/*' \
            ! -name 'SHA256SUMS.txt' \
            -print0 | sort -z | xargs -0 sha256sum | sed 's#  \./#  #' > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Commit finalized MandateGuard tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Finalize hardened MandateGuard submission'
          git push origin HEAD:main
