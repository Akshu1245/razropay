name: manifest-refresh-once

on:
  push:
    branches: ["submission-final-max"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: submission-final-max
      - name: Regenerate canonical manifest and remove this workflow
        run: |
          rm .github/workflows/manifest-refresh-once.yml
          python3 scripts/make_checksum_manifest.py > SHA256SUMS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SHA256SUMS.txt
          git add -u .github/workflows/manifest-refresh-once.yml
          git commit -m "Regenerate checksum after Docker fix"
          git push origin HEAD:submission-final-max
