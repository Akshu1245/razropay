name: mandateguard-ci

on:
  push:
  pull_request:

jobs:
  clean-checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Test
        run: ./scripts/test.sh
      - name: Offline demo
        run: ./scripts/demo.sh
        env:
          MANDATEGUARD_OFFLINE: "1"
      - name: Final benchmark
        run: |
          ./scripts/evaluate.sh
          # evaluate.sh is a GENERATION step: it re-renders the three chart PNGs
          # (architecture/frontier/sensitivity). Rendered PNGs are the only
          # shipped artefacts that are not byte reproducible across environments
          # (Matplotlib/FreeType/font/locale differences), so whatever this
          # runner's Matplotlib produces may differ from the shipped bytes.
          #
          # The next step (release gate) re-runs the full pytest suite, which
          # includes the shipped-artefact integrity test that hashes these PNGs
          # against SHA256SUMS.txt. Verification must hash the SHIPPED bytes,
          # never a fresh render, or CI would fail on any runner whose Matplotlib
          # differs from the one that built the release. This mirrors the
          # chart-preservation logic already inside scripts/release_check.sh and
          # the immutability guard in scripts/verify_all.sh. The regenerated data
          # artefacts (report.md, JSON, FINDINGS.md) are byte reproducible and
          # are intentionally kept.
          git checkout -- outputs/architecture.png outputs/frontier.png outputs/sensitivity.png
        env:
          MANDATEGUARD_OFFLINE: "1"
      - name: Release gate
        run: ./scripts/release_check.sh
        env:
          MANDATEGUARD_OFFLINE: "1"
      - name: README and report integrity
        run: |
          ! grep -nE '\{\{|\}\}' README.md outputs/report.md
          test -f outputs/manifest.json
          grep -q '"final": true' outputs/manifest.json
          grep -q '"B1.5"' outputs/manifest.json
          test -f outputs/sensitivity.json
          test -f outputs/sensitivity.png
          grep -q 'harm priced' outputs/report.md
      - name: Upload generated evidence
        uses: actions/upload-artifact@v5
        with:
          name: mandateguard-outputs
          path: |
            outputs/
            FINDINGS.md
