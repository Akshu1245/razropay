name: recoverytruth-integrity-refresh

on:
  push:
    branches: [recoverytruth-v2]
    paths:
      - '.integrity-refresh-request'

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[integrity-refresh]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recoverytruth-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install judge dependencies
        run: python -m pip install -r requirements.txt
      - name: Remove request marker and refresh integrity metadata
        run: |
          rm -f .integrity-refresh-request
          python scripts/refresh_branch_integrity.py
      - name: Verify refreshed manifest before commit
        run: sha256sum -c SHA256SUMS.txt
      - name: Commit refreshed checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(recoverytruth): refresh branch integrity [integrity-refresh]'
          git push origin HEAD:recoverytruth-v2
